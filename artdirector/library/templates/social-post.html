<!DOCTYPE html>
<html lang="en" data-title="Social post" data-category="social-card" data-format="instagram-square">
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style>
        @import url("https://fonts.bunny.net/css?family=fraunces:600,700|ibm-plex-sans:400,500");
        html, body { margin: 0; overflow: hidden; }
        .artboard {
            width: {{width}}px;
            height: {{height}}px;
            background: {{paper}};
            color: {{ink}};
            position: relative;
            overflow: hidden;
            font-family: "IBM Plex Sans", sans-serif;
        }
        .kicker {
            position: absolute;
            top: 72px;
            left: 72px;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            font-size: 18px;
            color: {{accent}};
        }
        h1 {
            position: absolute;
            top: 140px;
            left: 64px;
            right: 64px;
            margin: 0;
            font-family: Fraunces, serif;
            font-size: 92px;
            line-height: 0.92;
            letter-spacing: -0.04em;
        }
        .sub {
            position: absolute;
            left: 72px;
            right: 72px;
            bottom: 88px;
            font-size: 28px;
            line-height: 1.3;
        }
        .brand {
            position: absolute;
            right: 72px;
            top: 72px;
            font-size: 16px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="artboard" data-artdirector-root data-width="{{width}}" data-height="{{height}}" data-layer="card">
        <div class="kicker" data-layer="kicker">{{kicker}}</div>
        <div class="brand" data-layer="brandName">{{brandName}}</div>
        <h1 data-layer="title">{{title}}</h1>
        <p class="sub" data-layer="subtitle">{{subtitle}}</p>
    </div>
</body>
</html>
