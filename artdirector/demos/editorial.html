<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>The Geometry of Quiet</title>
    <style>
        @import url("https://fonts.bunny.net/css?family=fraunces:400,600,700|ibm-plex-sans:400,500");
        html, body { margin: 0; overflow: hidden; }
        .artboard {
            width: 1600px;
            height: 2000px;
            background: #f4efe6;
            color: #14110e;
            position: relative;
            overflow: hidden;
            font-family: "IBM Plex Sans", sans-serif;
        }
        .grain {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.18;
            background-image: radial-gradient(#14110e 0.6px, transparent 0.6px);
            background-size: 3px 3px;
        }
        .frame {
            position: absolute;
            inset: 72px;
            border: 1px solid #14110e;
        }
        .kicker {
            position: absolute;
            top: 110px;
            left: 110px;
            font-size: 18px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            font-weight: 500;
        }
        .rule {
            position: absolute;
            top: 160px;
            left: 110px;
            width: 72px;
            height: 8px;
            background: #c23b22;
        }
        h1 {
            position: absolute;
            top: 210px;
            left: 100px;
            right: 120px;
            margin: 0;
            font-family: Fraunces, serif;
            font-weight: 700;
            font-size: 188px;
            line-height: 0.86;
            letter-spacing: -0.04em;
        }
        h1 span { display: block; font-style: italic; font-weight: 400; font-size: 132px; }
        .colophon {
            position: absolute;
            right: 110px;
            top: 110px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 14px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }
        .footer {
            position: absolute;
            left: 110px;
            right: 110px;
            bottom: 110px;
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 40px;
        }
        .footer p {
            margin: 0;
            max-width: 520px;
            font-size: 22px;
            line-height: 1.35;
        }
        .mark {
            width: 72px;
            height: 72px;
            color: #c23b22;
        }
        .mark svg { width: 72px; height: 72px; }
    </style>
</head>
<body>
    <div class="artboard" data-artdirector-root data-width="1600" data-height="2000">
        <div class="grain"></div>
        <div class="frame"></div>
        <div class="kicker" data-ad-select="kicker">Northfold Press / Vol. 04 accepted live</div>
        <div class="rule" data-ad-select="accent-rule"></div>
        <h1 data-ad-select="title">The Geometry <span>of Quiet</span></h1>
        <div class="colophon">Printed matter for people who still look</div>
        <div class="footer">
            <p data-ad-select="standfirst">An issue about margins, pause, and the decision to leave the field empty on purpose.</p>
            <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg></div>
        </div>
    </div>
</body>
</html>
