<!DOCTYPE html>
<html lang="en" data-title="Infographic" data-category="infographic" data-format="infographic-portrait">
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style>
        @import url("https://fonts.bunny.net/css?family=ibm-plex-sans:400,600|ibm-plex-mono:400");
        html, body { margin: 0; overflow: hidden; }
        .artboard {
            width: {{width}}px;
            height: {{height}}px;
            background: {{paper}};
            color: {{ink}};
            font-family: "IBM Plex Sans", sans-serif;
            position: relative;
            overflow: hidden;
        }
        h1 {
            margin: 72px 64px 32px;
            font-size: 56px;
            line-height: 1;
        }
        .grid {
            margin: 0 64px;
            display: grid;
            gap: 24px;
        }
        .mod {
            border-top: 4px solid {{accent}};
            padding: 24px 0;
        }
        .mod h2 {
            margin: 0 0 8px;
            font-family: "IBM Plex Mono", monospace;
            font-size: 16px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: {{accent}};
        }
        .mod p { margin: 0; font-size: 22px; line-height: 1.35; }
    </style>
</head>
<body>
    <div class="artboard" data-artdirector-root data-width="{{width}}" data-height="{{height}}" data-layer="card">
        <h1 data-layer="title">{{title}}</h1>
        <div class="grid">
            <article class="mod"><h2>01</h2><p data-layer="kicker">{{kicker}}</p></article>
            <article class="mod"><h2>02</h2><p data-layer="subtitle">{{subtitle}}</p></article>
            <article class="mod"><h2>03</h2><p data-layer="body">{{body}}</p></article>
        </div>
    </div>
</body>
</html>
