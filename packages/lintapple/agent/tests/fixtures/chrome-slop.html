<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/20px sans-serif; margin: 0; display: flex; }
  aside { width: 240px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-height: 600px; }
  .profiles { display: flex; flex-direction: column; gap: 8px; }
  .profile { display: block; width: 100%; height: 36px; border: 1px solid #444; border-radius: 18px; text-align: left; padding: 0 12px; background: none; }
  .foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
  .foot a, .foot span { display: flex; gap: 8px; align-items: center; }
  svg { width: 16px; height: 16px; }
</style>
</head>
<body>
  <aside>
    <span>PERFIS</span>
    <div class="profiles" id="profiles">
      <button class="profile">Celular (grátis)</button>
      <button class="profile">Celular 3x2</button>
      <button class="profile">Default</button>
      <button class="profile">Novo perfil</button>
    </div>
    <div class="foot" id="user">
      <span><svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="3"/><path d="M2 15c0-4 12-4 12 0"/></svg>Gio</span>
      <a href="#"><svg viewBox="0 0 16 16"><path d="M6 2H2v12h4M10 4l4 4-4 4M14 8H6"/></svg>Sair</a>
      <span><svg viewBox="0 0 16 16"><rect width="16" height="16"/></svg>Ajuda</span>
    </div>
  </aside>
</body>
</html>
