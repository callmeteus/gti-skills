<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clean headings fixture</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff8f0; }
  header { background: #07083f; color: #fff; padding: 32px 64px; }
  main { padding: 48px 64px; }
  .meta { display: flex; gap: 12px; color: #555; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
  .lot { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; }
</style>
</head>
<body>
  <header>
    <h1>Leilões</h1>
    <p>Só para quem tem ingresso confirmado no Furzuê 2027.</p>
    <div class="meta"><span>Híbrido</span><span>Online ou local</span><span>Aberto</span></div>
  </header>
  <main>
    <div class="grid">
      <div class="lot"><h3>Leilão da caneca</h3><p>Lance atual: R$ 50,00</p></div>
      <div class="lot"><h3>Leilão do pôster</h3><p>Lance atual: R$ 80,00</p></div>
    </div>
    <section>
      <h2>Regras</h2>
      <p>Cada lance vale até o fim do leilão. Pagamento na retirada.</p>
    </section>
  </main>
</body>
</html>
