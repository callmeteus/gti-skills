<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/20px sans-serif; margin: 0; padding: 24px; width: 320px; }
  label, input, select, small { display: block; }
</style>
</head>
<body>
  <form id="slop">
    <label for="key">Tecla de mídia</label>
    <input id="key" value="play_pause">
    <small>play_pause · next · previous · volume_up · volume_down · mute</small>
  </form>
  <form id="clean">
    <label for="key2">Tecla de mídia</label>
    <select id="key2"><option value="play_pause">Tocar ou pausar</option><option value="next">Próxima faixa</option><option value="previous">Faixa anterior</option></select>
    <label for="name">Nome</label>
    <input id="name" value="Mídia">
    <small>Aparece no botão, por exemplo Mídia, Atalhos, Jogos.</small>
  </form>
</body>
</html>
