<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Card band fixture</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff8f0; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .item { background: #fff; border: 1px solid #eee; border-radius: 12px; overflow: hidden; }
  .band { background: #07083f; color: #fff; padding: 16px; }
  .body { padding: 16px; display: grid; gap: 12px; }
  .panel { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
</style>
</head>
<body>
  <main>
    <div class="grid">
      <article class="item"><div class="band">Experiência VIP</div><div class="body"><div class="panel">Lance inicial R$ 50,00</div><div class="panel">Finaliza em 5h45</div></div></article>
      <article class="item"><div class="band">Fursuit</div><div class="body"><div class="panel">Lance inicial R$ 80,00</div><div class="panel">Finaliza em 3h15</div></div></article>
    </div>
  </main>
</body>
</html>
