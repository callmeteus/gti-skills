<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Select filters fixture</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff8f0; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  .filters { display: flex; gap: 12px; align-items: end; }
  .filters label { display: grid; gap: 4px; font-size: 14px; }
  .filters select { height: 36px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 16px 0 32px; }
  .item { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; }
</style>
</head>
<body>
  <main>
    <form class="filters" aria-label="Filtros">
      <label>Modalidade <select><option value="">Todos</option><option value="online">Online</option><option value="presencial">Presencial</option></select></label>
      <label>Pagamento <select><option value="">Todos</option><option value="online">Pagamento online</option><option value="local">Pagamento local</option></select></label>
      <label>Público <select><option value="">Todos</option><option value="participantes">Só participantes</option></select></label>
      <button type="submit">Filtrar</button>
    </form>
    <section>
      <h2>Exclusivo para participantes</h2>
      <div class="grid">
        <article class="item"><h3>Experiência VIP</h3><p>Presencial</p></article>
        <article class="item"><h3>Fursuit</h3><p>Online</p></article>
      </div>
    </section>
    <section>
      <h2>Aberto a todos</h2>
      <div class="grid">
        <article class="item"><h3>Crachá</h3><p>Online</p></article>
        <article class="item"><h3>Kit</h3><p>Presencial</p></article>
      </div>
    </section>
  </main>
</body>
</html>
