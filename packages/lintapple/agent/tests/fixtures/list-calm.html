<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calm list fixture</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff8f0; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  .meta { color: #555; }
  .note { padding: 12px 16px; background: #fff; border-radius: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
  .item { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; }
  .item h3, .item p { margin: 0 0 8px; }
</style>
</head>
<body>
  <main>
    <section>
      <h2>For attendees</h2>
      <p class="meta">Hybrid · Open</p>
      <p class="note">Only attendees with a confirmed ticket can bid. <a href="#">Get a ticket</a></p>
      <div class="grid">
        <article class="item"><h3>VIP experience</h3><p class="meta">In person</p><p>Starting bid: 50.00</p></article>
        <article class="item"><h3>Fursuit</h3><p class="meta">Hybrid</p><p>Starting bid: 80.00</p></article>
      </div>
    </section>
  </main>
</body>
</html>
