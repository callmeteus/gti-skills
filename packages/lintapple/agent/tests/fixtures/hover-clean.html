<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/20px sans-serif; margin: 0; padding: 24px; }
  button, [role=button] { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  .card { display: block; border: 1px solid #ccc; border-radius: 8px; padding: 12px; width: 240px; color: inherit; text-decoration: none; transition: box-shadow 120ms, transform 120ms; }
  .tile { border: 1px solid #ccc; padding: 12px; width: 240px; }
  @media (hover: hover) {
    button:hover { background: #eee; }
    .card:hover { box-shadow: 0 4px 12px rgb(0 0 0 / 0.12); transform: translateY(-1px); }
    .row:hover .tile { border-color: #888; }
    .hover\:underline:hover { text-decoration: underline; }
  }
</style>
</head>
<body>
  <button id="save">Save</button>
  <button disabled>Archived</button>
  <a class="card" href="#">Project Atlas</a>
  <div class="row"><div class="tile" role="button" tabindex="0">Open report</div></div>
  <a class="hover:underline" href="#">Docs</a>
</body>
</html>
