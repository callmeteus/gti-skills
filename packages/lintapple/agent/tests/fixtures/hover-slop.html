<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/20px sans-serif; margin: 0; padding: 24px; }
  button { cursor: default; }
  .card { display: block; border: 1px solid #ccc; border-radius: 8px; padding: 12px; width: 240px; color: inherit; text-decoration: none; }
  .tile { border: 1px solid #ccc; padding: 12px; width: 240px; }
  a.plain:hover { text-decoration: underline; }
</style>
</head>
<body>
  <button id="save">Save</button>
  <a class="card" href="#">Project Atlas</a>
  <div class="tile" role="button" tabindex="0" id="tile">Open report</div>
  <a class="plain" href="#">Docs</a>
</body>
</html>
