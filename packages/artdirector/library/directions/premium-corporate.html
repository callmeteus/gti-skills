<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        @import url("https://fonts.bunny.net/css?family=newsreader:600,700");
        html, body { margin: 0; overflow: hidden; }
        .artboard {
            width: 480px;
            height: 300px;
            background: #161412;
            color: #ece7dc;
            position: relative;
            overflow: hidden;
            font-family: "Newsreader", sans-serif;
        }
        .bar { position: absolute; left: 0; top: 0; width: 12px; height: 100%; background: #c6a15b; }
        h1 { margin: 0; position: absolute; left: 36px; bottom: 36px; font-size: 42px; line-height: 0.9; letter-spacing: -0.04em; }
        .k { position: absolute; top: 28px; left: 36px; letter-spacing: 0.28em; font-size: 11px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="artboard" data-artdirector-root data-width="480" data-height="300">
        <div class="bar"></div>
        <div class="k">premium corporate</div>
        <h1>PRIVATE</h1>
    </div>
</body>
</html>
