<!DOCTYPE html>
<html lang="en" data-title="Carousel slide" data-category="carousel" data-format="carousel-slide">
<head>
    <meta charset="utf-8">
    <title>{{title|Como funciona}}</title>
    <style>
        @import url("https://fonts.bunny.net/css?family=space-grotesk:500,700|ibm-plex-sans:400");
        html, body { margin: 0; overflow: hidden; }
        .artboard {
            width: {{width}}px;
            height: {{height}}px;
            background: {{paper|#f4efe6}};
            color: {{ink|#14110e}};
            position: relative;
            overflow: hidden;
            font-family: "Space Grotesk", sans-serif;
        }
        .index {
            position: absolute;
            top: 56px;
            left: 56px;
            font-size: 18px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: {{accent|#c23b22}};
        }
        h1 {
            position: absolute;
            left: 56px;
            right: 56px;
            top: 280px;
            margin: 0;
            font-size: 72px;
            line-height: 0.95;
        }
        .sub {
            position: absolute;
            left: 56px;
            right: 56px;
            bottom: 80px;
            font-size: 26px;
        }
    </style>
</head>
<body>
    <div class="artboard" data-artdirector-root data-width="{{width}}" data-height="{{height}}" data-layer="card">
        <div class="index" data-layer="kicker">{{kicker|Guia rápido}}</div>
        <h1 data-layer="title">{{title|Como funciona}}</h1>
        <p class="sub" data-layer="subtitle">{{subtitle|O essencial em uma tela.}}</p>
    </div>
</body>
</html>
