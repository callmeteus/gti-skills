<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArtDirector</title>
    <link rel="stylesheet" href="/studio.css">
</head>
<body>
    <header class="masthead">
        <div class="mark">AD</div>
        <div>
            <p class="kicker" data-i18n="studio">Studio</p>
            <h1 id="project-name">ArtDirector</h1>
        </div>
        <nav class="modes" aria-label="Studio modes">
            <button data-mode="gallery" class="is-on"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg><span data-i18n="gallery">Gallery</span></button>
            <button data-mode="preview"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="preview">Preview</span></button>
        </nav>
        <div class="langs" role="group" aria-label="Language">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="pt">PT</button>
            <button type="button" data-lang="es">ES</button>
        </div>
    </header>

    <main id="main">
        <aside class="rail" id="rail"></aside>
        <section class="stage" id="stage"></section>
        <aside class="inspect" id="inspect"></aside>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script>
        window.__ARTDIRECTOR_TOKEN__ = "%%TOKEN%%";
        window.__ARTDIRECTOR_PORT__ = "%%PORT%%";
    </script>
    <script src="/studio.js"></script>
</body>
</html>
