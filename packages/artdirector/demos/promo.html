<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Night Market</title>
    <style>
        @import url("https://fonts.bunny.net/css?family=archivo-black:400|space-grotesk:500,700");
        html, body { margin: 0; overflow: hidden; }
        .artboard {
            width: 1080px;
            height: 1080px;
            background: #101010;
            color: #f4ef3a;
            position: relative;
            overflow: hidden;
            font-family: "Space Grotesk", sans-serif;
        }
        .stripe {
            position: absolute;
            top: 0;
            left: -10%;
            width: 120%;
            height: 46px;
            background: repeating-linear-gradient(-18deg, #f4ef3a 0 16px, #101010 16px 32px);
        }
        h1 {
            position: absolute;
            top: 90px;
            left: 48px;
            right: 48px;
            margin: 0;
            font-family: "Archivo Black", sans-serif;
            font-size: 168px;
            line-height: 0.82;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }
        .when {
            position: absolute;
            left: 56px;
            bottom: 64px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .stamp {
            position: absolute;
            right: 56px;
            bottom: 56px;
            width: 220px;
            height: 220px;
            border: 8px solid #f4ef3a;
            transform: rotate(-8deg);
            display: grid;
            place-items: center;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-size: 18px;
        }
        .stamp svg { width: 42px; height: 42px; margin-bottom: 8px; }
        .meta {
            position: absolute;
            top: 620px;
            left: 56px;
            font-size: 22px;
            color: #f4efe6;
            max-width: 520px;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="artboard" data-artdirector-root data-width="1080" data-height="1080">
        <div class="stripe"></div>
        <h1 data-ad-select="title">Night<br>Market</h1>
        <p class="meta" data-ad-select="body">Open air. No tickets. Bring cash and a jacket. The river walk, gate B.</p>
        <div class="when" data-ad-select="date">Sat 21 / 18:00</div>
        <div class="stamp" data-ad-select="stamp"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Free in</span></div>
    </div>
</body>
</html>
