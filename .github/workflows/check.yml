name: Check

on:
    push:
        branches: [master]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Validate skills and generated files
              run: node packages/cli check

            - name: Run tests
              run: npm test
