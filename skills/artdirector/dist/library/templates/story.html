<!DOCTYPE html>
<html lang="en" data-title="Story" data-category="thumbnail" data-format="story">
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style>
        @import url("https://fonts.bunny.net/css?family=syne:700,800|ibm-plex-sans:500,600");
        html, body { margin: 0; overflow: hidden; }
        .artboard {
            width: {{width}}px;
            height: {{height}}px;
            background: {{ink}};
            color: {{paper}};
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 220px 72px 260px;
            font-family: "IBM Plex Sans", sans-serif;
        }
        .band {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 24px;
            background: {{accent}};
        }
        .kicker {
            position: relative;
            margin: 0;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            font-size: 32px;
            font-weight: 600;
            color: {{accent}};
        }
        h1 {
            position: relative;
            margin: 32px 0 0;
            font-family: Syne, sans-serif;
            font-size: 200px;
            line-height: 0.84;
            font-weight: 800;
            letter-spacing: -0.04em;
            max-width: 9ch;
        }
        .sub {
            position: relative;
            margin: 40px 0 0;
            font-size: 42px;
            line-height: 1.25;
            max-width: 16ch;
        }
        .foot {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 32px;
        }
        .stamp {
            width: 160px;
            height: 160px;
            border: 6px solid {{paper}};
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: Syne, sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 16px;
            box-sizing: border-box;
        }
        .cta {
            border: 4px solid {{paper}};
            padding: 22px 36px;
            font-size: 28px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="artboard" data-artdirector-root data-width="{{width}}" data-height="{{height}}" data-layer="card">
        <div class="band"></div>
        <div data-layer="headline">
            <p class="kicker" data-layer="kicker">{{kicker}}</p>
            <h1 data-layer="title">{{title}}</h1>
            <p class="sub" data-layer="subtitle">{{subtitle}}</p>
        </div>
        <div class="foot">
            <div class="stamp" data-layer="brand">{{brandName}}</div>
            <div class="cta" data-layer="cta">{{cta}}</div>
        </div>
    </div>
</body>
</html>
