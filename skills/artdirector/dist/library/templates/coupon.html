<!DOCTYPE html>
<html lang="en" data-title="Coupon" data-category="coupon" data-format="coupon">
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style>
        @import url("https://fonts.bunny.net/css?family=fraunces:600|ibm-plex-mono:400,500");
        html, body { margin: 0; overflow: hidden; }
        .artboard {
            width: {{width}}px;
            height: {{height}}px;
            background: {{paper}};
            color: {{ink}};
            position: relative;
            overflow: hidden;
            font-family: "IBM Plex Mono", monospace;
            background-image: radial-gradient(circle at 0 50%, transparent 28px, {{paper}} 29px),
                radial-gradient(circle at 100% 50%, transparent 28px, {{paper}} 29px);
        }
        .dash {
            position: absolute;
            left: 48px;
            right: 48px;
            top: 50%;
            border-top: 2px dashed {{muted}};
        }
        h1 {
            margin: 48px 64px 0;
            font-family: Fraunces, serif;
            font-size: 54px;
        }
        .code {
            position: absolute;
            right: 64px;
            bottom: 48px;
            font-size: 28px;
            letter-spacing: 0.2em;
            color: {{accent}};
        }
        .sub { margin: 12px 64px; font-size: 18px; }
    </style>
</head>
<body>
    <div class="artboard" data-artdirector-root data-width="{{width}}" data-height="{{height}}" data-layer="card">
        <h1 data-layer="title">{{title}}</h1>
        <p class="sub" data-layer="subtitle">{{subtitle}}</p>
        <div class="dash"></div>
        <div class="code" data-layer="cta">{{cta}}</div>
    </div>
</body>
</html>
