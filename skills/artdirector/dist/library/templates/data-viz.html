<!DOCTYPE html>
<html lang="en" data-title="Data visual" data-category="data-viz" data-format="data-landscape">
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style>
        @import url("https://fonts.bunny.net/css?family=fraunces:600|ibm-plex-sans:400,500");
        html, body { margin: 0; overflow: hidden; }
        .artboard {
            width: {{width}}px;
            height: {{height}}px;
            background: {{paper}};
            color: {{ink}};
            font-family: "IBM Plex Sans", sans-serif;
            position: relative;
            overflow: hidden;
        }
        h1 {
            margin: 48px 56px 0;
            font-family: Fraunces, serif;
            font-size: 42px;
        }
        .stat {
            position: absolute;
            left: 56px;
            top: 180px;
            font-size: 160px;
            font-family: Fraunces, serif;
            letter-spacing: -0.06em;
            line-height: 1;
            color: {{accent}};
        }
        .bars {
            position: absolute;
            right: 64px;
            bottom: 64px;
            display: flex;
            align-items: end;
            gap: 16px;
            height: 280px;
        }
        .bar { width: 42px; background: {{ink}}; }
        .bar:nth-child(2) { height: 60%; background: {{accent}}; }
        .bar:nth-child(3) { height: 80%; }
        .bar:nth-child(1) { height: 40%; }
        .bar:nth-child(4) { height: 95%; background: {{accent}}; }
        .sub { position: absolute; left: 56px; bottom: 64px; max-width: 420px; font-size: 20px; }
    </style>
</head>
<body>
    <div class="artboard" data-artdirector-root data-width="{{width}}" data-height="{{height}}" data-layer="card">
        <h1 data-layer="title">{{title}}</h1>
        <div class="stat" data-layer="kicker">{{kicker}}</div>
        <p class="sub" data-layer="subtitle">{{subtitle}}</p>
        <div class="bars" aria-hidden="true">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
    </div>
</body>
</html>
