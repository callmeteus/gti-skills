<!DOCTYPE html>
<html lang="en" data-title="Editorial poster" data-category="editorial" data-format="editorial-poster">
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <style>
        @import url("https://fonts.bunny.net/css?family=fraunces:500,700|ibm-plex-sans:400");
        html, body { margin: 0; overflow: hidden; }
        .artboard {
            width: {{width}}px;
            height: {{height}}px;
            background: {{paper}};
            color: {{ink}};
            position: relative;
            overflow: hidden;
            font-family: "IBM Plex Sans", sans-serif;
        }
        .frame { position: absolute; inset: 48px; border: 1px solid {{ink}}; }
        h1 {
            position: absolute;
            left: 80px;
            top: 160px;
            right: 80px;
            margin: 0;
            font-family: Fraunces, serif;
            font-size: 128px;
            line-height: 0.88;
        }
        .kicker {
            position: absolute;
            top: 80px;
            left: 80px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-size: 16px;
        }
        .body {
            position: absolute;
            left: 80px;
            right: 80px;
            bottom: 80px;
            font-size: 28px;
            max-width: 720px;
        }
    </style>
</head>
<body>
    <div class="artboard" data-artdirector-root data-width="{{width}}" data-height="{{height}}" data-layer="card">
        <div class="frame"></div>
        <div class="kicker" data-layer="kicker">{{kicker}}</div>
        <h1 data-layer="title">{{title}}</h1>
        <p class="body" data-layer="body">{{body}}</p>
    </div>
</body>
</html>
