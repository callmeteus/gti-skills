[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assisted-sre"
version = "0.1.0"
description = "Scenario runner, check engine and report for AI-assisted SRE tests"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "boto3>=1.34", "pytest>=7"]

[project.scripts]
ai-sre = "runner.cli:main"

[tool.setuptools]
packages = ["runner", "checks", "sandbox"]
